name: Tests des skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Données personnelles et secrets (fichiers et auteurs de l'historique)
        run: python3 scripts/verifier_donnees_personnelles.py
      - name: Tests des scripts de calcul (conseiller-patrimoine)
        run: python3 .claude/skills/conseiller-patrimoine/scripts/tests/test_calculs.py
      - name: Coherence du corpus (renvois au referentiel, comptes, validite des parametres)
        run: python3 scripts/verifier_corpus.py
      - name: Tests du script de lookup et integrite du corpus CGI (assistant-fiscal-comptable)
        run: python3 .claude/skills/assistant-fiscal-comptable/scripts/tests/test_lookup.py
      - name: En-têtes YAML des SKILL.md valides
        run: |
          pip install --quiet "pyyaml==6.0.2"
          python3 - <<'PY'
          import re, sys, yaml, pathlib
          ok = True
          for p in sorted(pathlib.Path(".claude/skills").glob("*/SKILL.md")):
              m = re.match(r"^---\n(.*?)\n---", p.read_text(encoding="utf-8"), re.S)
              fm = yaml.safe_load(m.group(1)) if m else None
              if not isinstance(fm, dict) or not fm.get("name") or not fm.get("description"):
                  print(f"KO {p}"); ok = False; continue
              if fm["name"] != p.parent.name:
                  print(f"KO {p} : name différent du dossier"); ok = False; continue
              if len(fm["description"]) > 1024 or "<" in fm["description"] or ">" in fm["description"]:
                  print(f"KO {p} : description trop longue ou chevrons"); ok = False; continue
              print(f"OK {p} ({len(fm['description'])} caractères)")
          sys.exit(0 if ok else 1)
          PY
      - name: Paquets dist/ a jour avec les sources
        run: python3 scripts/build_skill_package.py --verifier
