schema_version: "1.1"
name: taux-livret-a-source
expected_outcome: |
  Réponse courte avec le taux fixé par le ministre, lu dans la session sur une source officielle
  (arrêté au Journal officiel, service-public.gouv.fr, economie.gouv.fr ou Banque de France après la
  décision, pas le seul communiqué de proposition), sa date d'effet, la prochaine date de révision
  normale et le lien. Aucun taux donné de mémoire.
